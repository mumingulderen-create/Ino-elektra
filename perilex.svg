<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f8fbf8"/>
      <stop offset="60%" stop-color="#edf4ee"/>
      <stop offset="100%" stop-color="#d9e6da"/>
    </radialGradient>
    <linearGradient id="plugBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e9ecea"/>
      <stop offset="100%" stop-color="#ccd2cf"/>
    </linearGradient>
    <linearGradient id="socketFace" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5ebe6"/>
    </linearGradient>
    <linearGradient id="pinMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d0d0d0"/>
      <stop offset="50%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="14" stdDeviation="12" flood-color="#1b381a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Soft Panel -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle electrical graphic watermark in background -->
  <path d="M 60 40 L 160 40 L 220 120 L 340 120" stroke="#cfe0d2" stroke-width="2" fill="none" stroke-dasharray="4 6"/>
  <path d="M 40 320 L 120 320 L 180 240 L 360 240" stroke="#cfe0d2" stroke-width="2" fill="none" stroke-dasharray="4 6"/>

  <!-- Wall Socket (Bottom Right Perspective) -->
  <g transform="translate(180, 160) rotate(-12)" filter="url(#softShadow)">
    <!-- Socket Outer Housing -->
    <rect x="0" y="0" width="165" height="165" rx="16" fill="url(#socketFace)" stroke="#cfd7d1" stroke-width="3"/>
    <rect x="8" y="8" width="149" height="149" rx="12" fill="none" stroke="#e8ede9" stroke-width="2"/>
    
    <!-- Central Circular Recess -->
    <circle cx="82.5" cy="82.5" r="54" fill="#f0f4f1" stroke="#bcc7bf" stroke-width="2.5"/>
    <circle cx="82.5" cy="82.5" r="48" fill="#e2e9e3"/>

    <!-- 4 Round Pin Holes -->
    <circle cx="62" cy="62" r="6.5" fill="#2d3330" stroke="#5a635e" stroke-width="1.5"/>
    <circle cx="103" cy="62" r="6.5" fill="#2d3330" stroke="#5a635e" stroke-width="1.5"/>
    <circle cx="62" cy="103" r="6.5" fill="#2d3330" stroke="#5a635e" stroke-width="1.5"/>
    <circle cx="103" cy="103" r="6.5" fill="#2d3330" stroke="#5a635e" stroke-width="1.5"/>

    <!-- Central Ground Slot (Perilex signature flat slot) -->
    <rect x="74" y="79" width="17" height="7" rx="2" fill="#1b1f1d" stroke="#5a635e" stroke-width="1"/>

    <!-- Screws on socket face -->
    <circle cx="58" cy="82.5" r="4.5" fill="#d4dbd6" stroke="#8d9991" stroke-width="1"/>
    <line x1="55" y1="82.5" x2="61" y2="82.5" stroke="#68736c" stroke-width="1.5"/>
    <circle cx="107" cy="82.5" r="4.5" fill="#d4dbd6" stroke="#8d9991" stroke-width="1"/>
    <line x1="104" y1="82.5" x2="110" y2="82.5" stroke="#68736c" stroke-width="1.5"/>
  </g>

  <!-- Red Power Cable with ribbed conduit -->
  <path d="M 40 340 C 50 280 70 240 105 200 L 135 220 C 105 255 85 290 75 350 Z" fill="#e53935" stroke="#b71c1c" stroke-width="2"/>
  <!-- Ribs on cable -->
  <g stroke="#b71c1c" stroke-width="2" stroke-linecap="round">
    <line x1="48" y1="330" x2="72" y2="338"/>
    <line x1="53" y1="312" x2="78" y2="320"/>
    <line x1="60" y1="294" x2="86" y2="302"/>
    <line x1="68" y1="276" x2="95" y2="284"/>
    <line x1="78" y1="258" x2="105" y2="266"/>
    <line x1="90" y1="240" x2="118" y2="248"/>
    <line x1="102" y1="222" x2="130" y2="230"/>
  </g>

  <!-- Perilex Plug (Angled Top Left) -->
  <g transform="translate(90, 45) rotate(22)" filter="url(#softShadow)">
    <!-- Plug grip body -->
    <path d="M 30 130 L 70 45 C 75 35 90 28 105 28 L 135 28 C 150 28 165 35 170 45 L 175 110 C 175 130 160 145 140 150 L 50 150 Z" 
          fill="url(#plugBody)" stroke="#bcc4be" stroke-width="2.5"/>

    <!-- Circular plug face with pins -->
    <ellipse cx="140" cy="115" rx="42" ry="42" fill="#edf2ee" stroke="#b4beb7" stroke-width="2"/>

    <!-- 4 Round Metal Pins projecting outward -->
    <g fill="url(#pinMetal)" stroke="#808882" stroke-width="1.2">
      <!-- Pin 1 -->
      <path d="M 120 86 L 155 60 L 161 67 L 126 93 Z"/>
      <ellipse cx="158" cy="63.5" rx="3.5" ry="4.5" fill="#f0f0f0"/>
      <!-- Pin 2 -->
      <path d="M 152 92 L 187 66 L 193 73 L 158 99 Z"/>
      <ellipse cx="190" cy="69.5" rx="3.5" ry="4.5" fill="#f0f0f0"/>
      <!-- Pin 3 -->
      <path d="M 115 125 L 150 99 L 156 106 L 121 132 Z"/>
      <ellipse cx="153" cy="102.5" rx="3.5" ry="4.5" fill="#f0f0f0"/>
      <!-- Pin 4 -->
      <path d="M 145 132 L 180 106 L 186 113 L 151 139 Z"/>
      <ellipse cx="183" cy="109.5" rx="3.5" ry="4.5" fill="#f0f0f0"/>

      <!-- Flat Center Ground Pin -->
      <path d="M 134 108 L 168 82 L 173 88 L 139 114 Z" fill="#9ba39d" stroke="#5a635e" stroke-width="1.5"/>
    </g>

    <!-- Handle screws and detail grooves -->
    <circle cx="85" cy="85" r="3.5" fill="#757f78"/>
    <circle cx="115" cy="55" r="3.5" fill="#757f78"/>
    <path d="M 80 115 L 60 135" stroke="#cfd7d1" stroke-width="2"/>
  </g>

  <!-- Clean Badge in corner -->
  <g transform="translate(24, 24)">
    <rect width="130" height="30" rx="8" fill="#ffffff" opacity="0.9" stroke="#cfe0d2" stroke-width="1.5"/>
    <text x="65" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#278a1d" letter-spacing="0.5">
      PERILEX 16A / 400V
    </text>
  </g>
</svg>
